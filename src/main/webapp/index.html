<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro con Cookies</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input[type=text], input[type=number], select { width: 100%; padding: 6px; box-sizing: border-box; }
  .error { color: #c00; font-size: 0.85em; min-height: 1em; }
  input.invalid, select.invalid { border: 2px solid #c00; }
  .check { font-weight: normal; display: inline; }
  button { margin-top: 16px; padding: 8px 20px; }
</style>
</head>
<body>

<h2>Registro de usuario</h2>

<form id="formulario" action="Servlet1" method="post" novalidate>

  <label for="nombre">Nombre </label>
  <input type="text" id="nombre" name="nombre" maxlength="30">
  <div class="error" id="err-nombre"></div>

  <label for="apellido">Apellido </label>
  <input type="text" id="apellido" name="apellido" maxlength="30">
  <div class="error" id="err-apellido"></div>

  <label for="edad">Edad</label>
  <input type="number" id="edad" name="edad" min="1" max="120" step="1">
  <div class="error" id="err-edad"></div>

  <label for="genero">Género </label>
  <select id="genero" name="genero">
    <option value="">-- Seleccione --</option>
    <option value="Masculino">Masculino</option>
    <option value="Femenino">Femenino</option>
    <option value="Otro">Otro</option>
  </select>
  <div class="error" id="err-genero"></div>

  <label for="color">Color favorito</label>
  <select id="color" name="color">
    <option value="">-- Seleccione --</option>
    <option value="Rojo">Rojo</option>
    <option value="Azul">Azul</option>
    <option value="Verde">Verde</option>
    <option value="Amarillo">Amarillo</option>
  </select>
  <div class="error" id="err-color"></div>

  <label>
    <input type="checkbox" id="suscrito" name="suscrito" value="true">
    <span class="check">Quiero recibir noticias </span>
  </label>

  <button type="submit">Enviar</button>
</form>

<script>
  
  const REGEX_TEXTO = /^\p{L}{2,40}$/u; // solo letras, de 2 a 30 caracteres

  function setError(id, msg) {
    document.getElementById('err-' + id).textContent = msg;
    document.getElementById(id).classList.toggle('invalid', msg !== '');
    return msg === '';
  }

  function validarTexto(id, etiqueta) {
    const v = document.getElementById(id).value.trim();
    if (v === '') return setError(id, etiqueta + ' es obligatorio.');
    if (!REGEX_TEXTO.test(v)) return setError(id, etiqueta + ': solo letras (sin espacios, números ni símbolos), entre 2 y 40 caracteres.');
    return setError(id, '');
  }

  function validarEdad() {
    const v = document.getElementById('edad').value.trim();
    if (v === '') return setError('edad', 'La edad es obligatoria.');
    if (!/^\d+$/.test(v)) return setError('edad', 'La edad debe ser un número entero.');
    const n = parseInt(v, 10);
    if (n < 1 || n > 120) return setError('edad', 'La edad debe estar entre 1 y 120.');
    return setError('edad', '');
  }

  function validarSelect(id, etiqueta) {
    if (document.getElementById(id).value === '') return setError(id, 'Seleccione ' + etiqueta + '.');
    return setError(id, '');
  }

  document.getElementById('formulario').addEventListener('submit', function (e) {
    const resultados = [
      validarTexto('nombre', 'El nombre'),
      validarTexto('apellido', 'El apellido'),
      validarEdad(),
      validarSelect('genero', 'un género'),
      validarSelect('color', 'un color')
    ];
    if (resultados.includes(false)) e.preventDefault(); 
  });

  
  document.getElementById('nombre').addEventListener('blur', () => validarTexto('nombre', 'El nombre'));
  document.getElementById('apellido').addEventListener('blur', () => validarTexto('apellido', 'El apellido'));
  document.getElementById('edad').addEventListener('blur', validarEdad);
  document.getElementById('genero').addEventListener('change', () => validarSelect('genero', 'un género'));
  document.getElementById('color').addEventListener('change', () => validarSelect('color', 'un color'));
</script>

</body>
</html>
